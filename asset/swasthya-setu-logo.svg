<svg width="700" height="700" viewBox="0 0 700 700"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main Purple Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17152F"/>
      <stop offset="45%" stop-color="#35106B"/>
      <stop offset="100%" stop-color="#120D2B"/>
    </linearGradient>

    <!-- Purple Glow -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B389FF"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <!-- Voice Gradient -->
    <linearGradient id="voice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Healthcare Gradient -->
    <linearGradient id="health" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB7E9"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Rural Green -->
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for inner landscape -->
    <clipPath id="innerCircle">
      <circle cx="350" cy="350" r="270"/>
    </clipPath>

  </defs>


  <!-- ===================================== -->
  <!-- OUTER EMBLEM -->
  <!-- ===================================== -->

  <circle
    cx="350"
    cy="350"
    r="320"
    fill="#0D0B24"
    stroke="#6D28D9"
    stroke-width="4"/>

  <circle
    cx="350"
    cy="350"
    r="305"
    fill="none"
    stroke="url(#voice)"
    stroke-width="3"
    opacity="0.75"/>

  <circle
    cx="350"
    cy="350"
    r="292"
    fill="url(#bg)"
    stroke="#A78BFA"
    stroke-width="2"/>


  <!-- ===================================== -->
  <!-- DECORATIVE ORBIT / CONNECTION -->
  <!-- ===================================== -->

  <path
    d="M 110 355
       C 145 205, 250 105, 350 105
       C 450 105, 555 205, 590 355"
    fill="none"
    stroke="#8B5CF6"
    stroke-width="3"
    opacity="0.45"/>

  <path
    d="M 110 365
       C 145 515, 250 595, 350 595
       C 450 595, 555 515, 590 365"
    fill="none"
    stroke="#67E8F9"
    stroke-width="3"
    opacity="0.30"/>


  <!-- Connection nodes -->
  <g fill="#67E8F9" filter="url(#smallGlow)">
    <circle cx="112" cy="350" r="7"/>
    <circle cx="588" cy="350" r="7"/>
    <circle cx="165" cy="190" r="6"/>
    <circle cx="535" cy="190" r="6"/>
  </g>


  <!-- ===================================== -->
  <!-- INNER WORLD / RURAL LANDSCAPE -->
  <!-- ===================================== -->

  <circle
    cx="350"
    cy="350"
    r="270"
    fill="#11112C"
    stroke="#4C1D95"
    stroke-width="3"/>

  <g clip-path="url(#innerCircle)">

    <!-- Moon / Sun -->
    <circle
      cx="480"
      cy="180"
      r="48"
      fill="#FDE68A"
      opacity="0.85"
      filter="url(#smallGlow)"/>

    <!-- Sky glow -->
    <circle
      cx="480"
      cy="180"
      r="78"
      fill="#C084FC"
      opacity="0.10"/>


    <!-- Background hills -->
    <path
      d="M 60 400
         Q 160 300 250 370
         Q 350 260 450 360
         Q 530 285 650 380
         L 650 650
         L 60 650 Z"
      fill="#24134D"/>

    <path
      d="M 60 445
         Q 180 350 275 425
         Q 375 340 475 420
         Q 560 350 650 425
         L 650 650
         L 60 650 Z"
      fill="#30205B"/>


    <!-- Rural fields -->
    <path
      d="M 40 475
         Q 170 425 350 485
         Q 510 425 660 475
         L 660 650
         L 40 650 Z"
      fill="#153C3B"/>

    <path
      d="M 40 515
         Q 180 460 350 520
         Q 520 460 660 515
         L 660 650
         L 40 650 Z"
      fill="url(#field)"
      opacity="0.20"/>


    <!-- Field lines -->
    <g
      fill="none"
      stroke="#6EE7B7"
      stroke-width="3"
      opacity="0.35">

      <path d="M 60 560 Q 190 500 330 555 Q 470 610 640 535"/>
      <path d="M 60 595 Q 200 535 335 590 Q 480 640 640 570"/>
      <path d="M 80 630 Q 210 570 350 625 Q 500 670 630 610"/>

    </g>


    <!-- ================================= -->
    <!-- VILLAGE HOUSES -->
    <!-- ================================= -->

    <!-- Left house -->
    <g transform="translate(115 355)">

      <path
        d="M 0 70 L 55 20 L 110 70 Z"
        fill="#7C3AED"/>

      <rect
        x="15"
        y="68"
        width="80"
        height="70"
        rx="4"
        fill="#31205D"/>

      <rect
        x="48"
        y="95"
        width="22"
        height="43"
        fill="#17152F"/>

      <rect
        x="25"
        y="82"
        width="18"
        height="18"
        rx="3"
        fill="#67E8F9"
        opacity="0.8"/>

      <rect
        x="67"
        y="82"
        width="18"
        height="18"
        rx="3"
        fill="#67E8F9"
        opacity="0.8"/>

    </g>


    <!-- Right house -->
    <g transform="translate(475 365)">

      <path
        d="M 0 65 L 48 18 L 100 65 Z"
        fill="#8B5CF6"/>

      <rect
        x="12"
        y="63"
        width="75"
        height="65"
        rx="4"
        fill="#28194F"/>

      <rect
        x="42"
        y="91"
        width="20"
        height="37"
        fill="#17152F"/>

      <rect
        x="22"
        y="78"
        width="16"
        height="16"
        rx="3"
        fill="#A7F3D0"
        opacity="0.75"/>

      <rect
        x="67"
        y="78"
        width="16"
        height="16"
        rx="3"
        fill="#A7F3D0"
        opacity="0.75"/>

    </g>


    <!-- ================================= -->
    <!-- SETU / BRIDGE -->
    <!-- ================================= -->

    <path
      d="M 160 570
         Q 350 445 540 570"
      fill="none"
      stroke="#A78BFA"
      stroke-width="18"
      opacity="0.18"/>

    <path
      d="M 160 570
         Q 350 445 540 570"
      fill="none"
      stroke="url(#voice)"
      stroke-width="7"/>

    <!-- Bridge supports -->
    <g
      stroke="#8B5CF6"
      stroke-width="6"
      opacity="0.8">

      <path d="M 220 535 L 220 600"/>
      <path d="M 280 505 L 280 600"/>
      <path d="M 350 485 L 350 600"/>
      <path d="M 420 505 L 420 600"/>
      <path d="M 480 535 L 480 600"/>

    </g>


    <!-- ================================= -->
    <!-- PEOPLE / COMMUNITY -->
    <!-- ================================= -->

    <!-- Person left -->
    <g transform="translate(185 410)">

      <circle
        cx="0"
        cy="0"
        r="14"
        fill="#FBCFE8"/>

      <path
        d="M -25 65
           Q 0 20 25 65
           Z"
        fill="#7C3AED"/>

    </g>


    <!-- Person right -->
    <g transform="translate(505 420)">

      <circle
        cx="0"
        cy="0"
        r="13"
        fill="#FDE68A"/>

      <path
        d="M -23 60
           Q 0 20 23 60
           Z"
        fill="#8B5CF6"/>

    </g>

  </g>


  <!-- ===================================== -->
  <!-- CENTRAL VOICE-FIRST MICROPHONE -->
  <!-- ===================================== -->

  <!-- Microphone glow -->
  <circle
    cx="350"
    cy="295"
    r="105"
    fill="#8B5CF6"
    opacity="0.12"
    filter="url(#glow)"/>


  <!-- Microphone outer capsule -->
  <rect
    x="302"
    y="190"
    width="96"
    height="145"
    rx="48"
    fill="#15102D"
    stroke="url(#voice)"
    stroke-width="7"
    filter="url(#smallGlow)"/>


  <!-- Microphone inner -->
  <rect
    x="320"
    y="208"
    width="60"
    height="105"
    rx="30"
    fill="url(#purpleGlow)"/>


  <!-- Mic grille -->
  <g
    stroke="#E9D5FF"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.9">

    <path d="M 333 230 L 367 230"/>
    <path d="M 330 245 L 370 245"/>
    <path d="M 330 260 L 370 260"/>
    <path d="M 330 275 L 370 275"/>
    <path d="M 333 290 L 367 290"/>

  </g>


  <!-- Microphone stand -->
  <path
    d="M 285 278
       C 285 350 415 350 415 278"
    fill="none"
    stroke="#C4B5FD"
    stroke-width="9"
    stroke-linecap="round"/>

  <path
    d="M 350 350 L 350 390"
    stroke="#C4B5FD"
    stroke-width="9"
    stroke-linecap="round"/>

  <path
    d="M 315 390 L 385 390"
    stroke="#C4B5FD"
    stroke-width="9"
    stroke-linecap="round"/>


  <!-- ===================================== -->
  <!-- VOICE WAVES -->
  <!-- ===================================== -->

  <g
    fill="none"
    stroke="url(#voice)"
    stroke-linecap="round"
    filter="url(#smallGlow)">

    <!-- Left -->
    <path
      d="M 275 245 Q 245 270 275 295"
      stroke-width="8"/>

    <path
      d="M 250 225 Q 205 270 250 315"
      stroke-width="6"
      opacity="0.8"/>

    <path
      d="M 225 205 Q 165 270 225 335"
      stroke-width="4"
      opacity="0.55"/>

    <!-- Right -->
    <path
      d="M 425 245 Q 455 270 425 295"
      stroke-width="8"/>

    <path
      d="M 450 225 Q 495 270 450 315"
      stroke-width="6"
      opacity="0.8"/>

    <path
      d="M 475 205 Q 535 270 475 335"
      stroke-width="4"
      opacity="0.55"/>

  </g>


  <!-- ===================================== -->
  <!-- HEALTHCARE HEART -->
  <!-- ===================================== -->

  <path
    d="M 350 430
       C 325 400 285 415 285 450
       C 285 485 350 515 350 515
       C 350 515 415 485 415 450
       C 415 415 375 400 350 430 Z"
    fill="url(#health)"
    opacity="0.95"
    filter="url(#smallGlow)"/>


  <!-- Medical cross inside heart -->
  <g fill="#FFFFFF">

    <rect
      x="338"
      y="430"
      width="24"
      height="62"
      rx="5"/>

    <rect
      x="319"
      y="449"
      width="62"
      height="24"
      rx="5"/>

  </g>


  <!-- ===================================== -->
  <!-- CONNECTED HEALTH NODES -->
  <!-- ===================================== -->

  <!-- Left patient node -->
  <g filter="url(#smallGlow)">

    <circle
      cx="175"
      cy="300"
      r="20"
      fill="#67E8F9"/>

    <circle
      cx="175"
      cy="300"
      r="8"
      fill="#17152F"/>

    <path
      d="M 195 300 C 225 300 245 290 270 280"
      fill="none"
      stroke="#67E8F9"
      stroke-width="4"
      stroke-dasharray="7 7"/>

  </g>


  <!-- Right doctor node -->
  <g filter="url(#smallGlow)">

    <circle
      cx="525"
      cy="300"
      r="20"
      fill="#C084FC"/>

    <path
      d="M 517 300
         L 533 300
         M 525 292
         L 525 308"
      stroke="#17152F"
      stroke-width="5"
      stroke-linecap="round"/>

    <path
      d="M 505 300 C 475 300 455 290 430 280"
      fill="none"
      stroke="#C084FC"
      stroke-width="4"
      stroke-dasharray="7 7"/>

  </g>


  <!-- ===================================== -->
  <!-- SMALL LEAF / RURAL DETAILS -->
  <!-- ===================================== -->

  <g fill="#86EFAC" opacity="0.9">

    <path
      d="M 145 535
         Q 125 510 150 500
         Q 170 520 145 535 Z"/>

    <path
      d="M 555 535
         Q 580 510 560 495
         Q 535 515 555 535 Z"/>

  </g>


  <!-- ===================================== -->
  <!-- FINAL HIGHLIGHT RING -->
  <!-- ===================================== -->

  <circle
    cx="350"
    cy="350"
    r="275"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1"
    opacity="0.18"/>

  <circle
    cx="350"
    cy="350"
    r="320"
    fill="none"
    stroke="url(#purpleGlow)"
    stroke-width="2"
    opacity="0.6"/>

</svg>
